name: Secret check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan Git history without exposing secret values
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          temporary = Path(os.environ["RUNNER_TEMP"])
          report = temporary / "gitleaks-redacted.json"
          # Never stream scanner output or publish report artifacts.
          with (temporary / "gitleaks-output.log").open("w") as output:
              result = subprocess.run([
                  str(temporary / "gitleaks"), "git", ".",
                  "--redact=100", "--no-banner", "--log-opts=--all",
                  "--report-format=json", f"--report-path={report}",
              ], stdout=output, stderr=subprocess.STDOUT, check=False)
          if result.returncode == 0:
              print("No secrets detected by Gitleaks.")
          elif result.returncode == 1 and report.is_file():
              findings = json.loads(report.read_text())
              print(f"::error::Gitleaks detected {len(findings)} potential secret(s). Review privately.")
              for finding in findings[:50]:
                  print("Finding: " + json.dumps({
                      "rule": finding.get("RuleID"),
                      "file": finding.get("File"),
                      "line": finding.get("StartLine"),
                      "commit": finding.get("Commit"),
                  }, ensure_ascii=True))
          else:
              print("::error::Gitleaks could not complete the scan; raw output is suppressed.")
          sys.exit(result.returncode)
